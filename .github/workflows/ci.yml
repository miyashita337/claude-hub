name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: supervisor

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            supervisor/node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('supervisor/bun.lock', 'supervisor/package.json') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      # Issue #100: prevent silent CHANNEL_MAP / access policy drift.
      # Verifies CHANNEL_MAP keys match examples/access-policy.template.json
      # (which uses channel names, not real Discord IDs — IDs stay user-local).
      - name: Check CHANNEL_MAP ↔ access policy template sync
        run: bun scripts/check-access-policy.ts --ci

      # Issue #27 (Task 3): block synchronous child-process calls (execSync /
      # execFileSync / spawnSync) inside setTimeout/setInterval callbacks — they
      # freeze the single-process Supervisor event loop on every tick. AST-based,
      # so comments mentioning execSync (manager.ts has several) don't false-fire.
      - name: Lint - no blocking exec inside timer callbacks (#27)
        run: bun scripts/lint-blocking-in-timers.ts

      # Issue #227 (PR-4): no synchronous child-process exec (execSync /
      # execFileSync / spawnSync) anywhere under src/session/**. PR-1/2/3 made
      # the hot paths async; this keeps the whole session tree sync-exec-free so
      # a regression cannot silently reintroduce an event-loop-blocking call.
      # AST-based, so comments citing the migration don't false-fire.
      - name: Lint - no synchronous exec in src/session (#227 PR-4)
        run: bun scripts/lint-no-sync-exec.ts

      # Issue #248 (RW-029 / F1 class): every tests/**/*.test.ts must be gated in
      # this file or justifiably excluded in scripts/lint-gating-coverage.ts.
      # Prevents a newly-added test from being silently never-run in CI.
      - name: Lint - CI test gating coverage (#248)
        run: bun scripts/lint-gating-coverage.ts

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tmux is required by tests/session/relay.test.ts (Issue #73 / AC-7).
      # Without it the new copy-mode / hyphen-payload regression tests
      # `tmuxAvailable()` check fails and they auto-skip, which drops patch
      # coverage of relay.ts and produces a codecov/patch FAIL on the PR.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            supervisor/node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('supervisor/bun.lock', 'supervisor/package.json') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Curated list of deterministic, non-tmux test files. dialog-detect is
      # pure/deterministic and gated here (#153). dialog-watchdog was wall-clock
      # timing-flaky but is now driven by an injected virtual clock (#190), so
      # it is deterministic and gated here too — this also gates the
      # feedback-survey "send 0, never 1" regression test it contains (#153).
      # tests/integration/worktree-real-git.test.ts (#382) is gated here too: it
      # drives REAL `git worktree add/remove/list/prune` against a throwaway repo
      # in a temp dir. git is always present on the runner (actions/checkout
      # needs it) and the suite touches neither tmux nor gh, so it needs no extra
      # setup and stays deterministic in this job.
      - name: Run tests
        env:
          SUPERVISOR_DB_PATH: ":memory:"
          TMUX_PATH: /usr/bin/tmux
        run: |
          bun test --coverage --coverage-reporter=lcov \
                   tests/session/output-formatter.test.ts \
                   tests/session/attachment-store.test.ts \
                   tests/session/relay.test.ts \
                   tests/session/relay-server.test.ts \
                   tests/session/gc-attachments.test.ts \
                   tests/session/queue-resilience.test.ts \
                   tests/session/manager.test.ts \
                   tests/session/manager-resume.test.ts \
                   tests/session/manager-liveness.test.ts \
                   tests/commands/session-interaction.test.ts \
                   tests/commands/session-resume.test.ts \
                   tests/hooks/stop-relay.test.ts \
                   tests/infra/db.test.ts \
                   tests/infra/db-isolation.test.ts \
                   tests/infra/hook-wiring-check.test.ts \
                   tests/session/dialog-detect.test.ts \
                   tests/session/dialog-watchdog.test.ts \
                   tests/session/relay-send-failure.test.ts \
                   tests/session/relay-error-notice.test.ts \
                   tests/scripts/lint-blocking-in-timers.test.ts \
                   tests/scripts/lint-no-sync-exec.test.ts \
                   tests/session/notify-pushover.test.ts \
                   tests/session/dialog-stuck-handler.test.ts \
                   tests/session/stall-heartbeat.test.ts \
                   tests/session/context-budget.test.ts \
                   tests/session/session-activity-watchdog.test.ts \
                   tests/hijoguchi-routing/p0.test.ts \
                   tests/e2e/ac-verification.test.ts \
                   tests/scripts/lint-gating-coverage.test.ts \
                   tests/scripts/traceability-metrics.test.ts \
                   tests/commands/session-compact.test.ts \
                   tests/commands/compact-button.test.ts \
                   tests/session/manager-compact-concurrency.test.ts \
                   tests/commands/session-start-access.test.ts \
                   tests/commands/session-start-branch.test.ts \
                   tests/commands/session-thread-title.test.ts \
                   tests/commands/session-stop.test.ts \
                   tests/commands/session-list.test.ts \
                   tests/commands/session-status.test.ts \
                   tests/config/access-policy.test.ts \
                   tests/config/check-access-policy.test.ts \
                   tests/discord/in-memory-client.test.ts \
                   tests/discord/real-client.test.ts \
                   tests/guards/access-enforcement-wired.test.ts \
                   tests/hooks/ask-user-relay.test.ts \
                   tests/hooks/auto-approve-permission.test.ts \
                   tests/hooks/headless-pending-guard.test.ts \
                   tests/hooks/progress-relay.test.ts \
                   tests/scripts/cleanup-idle-claude.test.ts \
                   tests/scripts/setup-agent-base.test.ts \
                   tests/session/ask-user-relay.test.ts \
                   tests/session/dispatch.test.ts \
                   tests/session/dispatch-run.test.ts \
                   tests/session/dispatch-integration.test.ts \
                   tests/session/dispatch-headless.test.ts \
                   tests/session/dispatch-report.test.ts \
                   tests/session/artifact-probe.test.ts \
                   tests/session/orchestrate.test.ts \
                   tests/session/adapters-executor.test.ts \
                   tests/session/manager-headless.test.ts \
                   tests/session/headless-liveness.test.ts \
                   tests/session/pending-work.test.ts \
                   tests/session/reaper.test.ts \
                   tests/session/dispatch-queue.test.ts \
                   tests/session/admission.test.ts \
                   tests/session/latency-logger.test.ts \
                   tests/session/manager-input-ready.test.ts \
                   tests/session/progress-buffer.test.ts \
                   tests/session/salvage-reply.test.ts \
                   tests/session/slash-prefix.test.ts \
                   tests/session/thread-title.test.ts \
                   tests/session/worktree.test.ts \
                   tests/integration/worktree-real-git.test.ts \
                   tests/session/keep-attachment.test.ts \
                   tests/commands/session-keep.test.ts \
                   tests/session/self-heal.test.ts \
                   tests/session/self-heal-restart.test.ts \
                   tests/action/token.test.ts \
                   tests/action/execute.test.ts \
                   tests/action/receiver.test.ts \
                   tests/session/hub-work.test.ts \
                   tests/session/relay-server-hub-work.test.ts \
                   tests/session/relay-server-channel-post.test.ts \
                   tests/session/relay-port-isolation.test.ts \
                   tests/tools/session-ctl.test.ts \
                   tests/tools/e2e-isolated.test.ts

      # #238 regression: realTmuxAdapter.hasSession must treat a tmux
      # control-channel ETIMEDOUT as "alive" (assume the session survives),
      # never as a silent teardown. This file is the unit gate for that fix
      # (PR #239). It uses mock.module("child_process"), which is
      # process-global in Bun and would leak into the curated list above, so it
      # runs as its OWN `bun test` process. No `|| true` — it must gate the
      # build (RW-029: a silently-green CI is worse than a red one). Not run
      # with --coverage so it does not overwrite the lcov.info produced above.
      - name: Run mock-isolated session tests (#238 hasSession ETIMEDOUT)
        env:
          SUPERVISOR_DB_PATH: ":memory:"
          TMUX_PATH: /usr/bin/tmux
        run: bun test tests/session/adapters-hassession.test.ts

      # adapters.test.ts and tmux.test.ts each call mock.module("child_process"),
      # which is process-global in Bun and pollutes any file sharing the process
      # (running the three mock.module files together yields cross-file failures).
      # So each gets its OWN `bun test` process — same isolation rationale as the
      # #238 step above (#248: these were previously ungated → never run in CI).
      - name: Run mock-isolated adapters tests (#248)
        env:
          SUPERVISOR_DB_PATH: ":memory:"
          TMUX_PATH: /usr/bin/tmux
        run: bun test tests/session/adapters.test.ts

      - name: Run mock-isolated tmux tests (#248)
        env:
          SUPERVISOR_DB_PATH: ":memory:"
          TMUX_PATH: /usr/bin/tmux
        run: bun test tests/session/tmux.test.ts

      # #227 (PR-1 / #249) AC-3: relay.ts's tmux send hot path must stay
      # non-blocking after the execFileSync→execFile migration. This file mocks
      # child_process.execFile via mock.module (process-global in Bun), so it
      # runs as its OWN `bun test` process — same isolation rationale as the
      # mock-isolated steps above. No `|| true`: it gates the build.
      - name: Run mock-isolated relay non-blocking test (#227 / #249)
        env:
          SUPERVISOR_DB_PATH: ":memory:"
          TMUX_PATH: /usr/bin/tmux
        run: bun test tests/session/relay-nonblocking.test.ts

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: supervisor/coverage/lcov.info
          flags: unit-tests
          fail_ci_if_error: false

  routing-tests:
    name: Routing Tests (S5 #51)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Run start-hijoguchi template-render tests (#49 AC-4)
        run: bash scripts/test-start-hijoguchi.sh

      - name: Run routing matrix (25 cases, P0×12 gating)
        run: bash scripts/test-hijoguchi-routing.sh

      - name: Run claudeHubExit mechanical mention gate tests (#267)
        run: bash scripts/test-hijoguchi-discord-gate.sh

      - name: Run claudeHubExit turn-state producer tests (#312)
        run: bash scripts/test-hijoguchi-record-turn-state.sh

      # Guards the launchd plist install convention (#198). The placeholder
      # check is portable; plutil -lint self-skips on Linux (macOS-only tool).
      - name: Run launchd plist placeholder tests (#198)
        run: bash scripts/test-plist-placeholders.sh

  # E2E verification of the Discord ↔ Supervisor ↔ Claude Code relay chain.
  # Covers AC-4/5/6/7 hermetically (tmux + mock claude + relay-server HTTP).
  # AC-1/2/3 require a live Discord bot token and are documented as manual
  # verification in the PR description. See tests/e2e/ac-verification.test.ts.
  # This job MUST run on every push / PR so that AC-7 (hyphen + Japanese
  # payload) regressions are caught before merge — see Issue #73.
  e2e-tests:
    name: E2E Tests (AC-1..AC-7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux + jq
        # jq is required by tests/e2e/fixtures/claude-mock.sh for safe JSON
        # encoding of the relay POST (the session-lifecycle E2E step below).
        run: sudo apt-get update && sudo apt-get install -y tmux jq

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            supervisor/node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('supervisor/bun.lock', 'supervisor/package.json') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: supervisor

      - name: Run AC E2E verification
        env:
          SUPERVISOR_DB_PATH: ":memory:"
          TMUX_PATH: /usr/bin/tmux
        run: bun test tests/e2e/ac-verification.test.ts tests/session/relay.test.ts tests/e2e/dialog-stall.test.ts
        working-directory: supervisor

      # Supervisor ↔ tmux session lifecycle E2E (Issue #144 / #273). Runs as its
      # OWN `bun test` process — same isolation rationale as the mock-isolated
      # session tests above. The env below is what makes the suite ACTUALLY run
      # (it self-skips without both vars). Test-only socket `claude-hub-test`
      # keeps it isolated from any prod `claude-hub` server (RW-019).
      - name: Run session lifecycle E2E
        env:
          SUPERVISOR_DB_PATH: ":memory:"
          TMUX_PATH: /usr/bin/tmux
          SUPERVISOR_TMUX_SOCKET: claude-hub-test
          SUPERVISOR_CLAUDE_PATH: ${{ github.workspace }}/supervisor/tests/e2e/fixtures/claude-mock.sh
        run: bun test tests/e2e/session-lifecycle.test.ts
        working-directory: supervisor

  # Local-only tests (require tmux/Claude CLI or local config):
  #   manager.test.ts  — tmux + Claude Code CLI
  #   iterm2.test.ts   — ~/.claude/scripts/project-colors.json
